[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-relay-py"
version = "0.1.0"
description = "Responses API <-> Chat Completions API translation bridge for OpenAI Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "httpx>=0.24",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py", "py.*"]
